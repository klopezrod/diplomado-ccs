<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Kenny - Desarrollo Web</title>
    <!-- Fuentes de Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!--Animate.css-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <!--Hoja de animaciones-->
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

    <!-- Encabezado / Navbar Inteligente -->
    <header class="navbar navbar-expand-lg">
    <a class="navbar-brand" href="../index.html">
        <img src="../assets/Logo_nuevo-removebg-preview.png" alt="Logo construcción" class="logo">
    </a>
    
    <!-- Botón hamburguesa para móviles -->
    <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuNavegacion" aria-controls="menuNavegacion" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <nav class="collapse navbar-collapse justify-content-end" id="menuNavegacion">
        <ul class="navbar-nav nav-links mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
            <li class="nav-item"><a class="nav-link" href="../pages/proyectos.html">Proyecto</a></li>
            <li class="nav-item"><a class="nav-link" href="../pages/servicios.html">Servicios</a></li>
            <li class="nav-item"><a class="nav-link" href="../pages/sobre-mi.html">Sobre mí</a></li>
        </ul>
    </nav>
    </header> 

    <!-- Contenido -->
    <main class="main">
        <h1>Contacto</h1>
        <img src="../assets/bloques.jpg" alt="Imagen bloques" class="home-img">
        
        <!-- FORMULARIO -->
        <section class="seccion-form">
            <h2>Solicitar Presupuesto</h2>
            <form action="#" method="POST" class="formulario">
                
                <div class="campo">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez" required>
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="campo">
                    <label for="presupuesto">Presupuesto estimado (USD):</label>
                    <input type="number" id="presupuesto" name="presupuesto" min="100" placeholder="Ej. 1500" required>
                </div>

                <button type="submit" class="btn-enviar">Enviar Consulta</button>
            </form>
        </section>
    </main>

    <!-- Pie de pagina -->
    <footer>
        <div class="footer-container">
            <div class="redes-sociales">
                <!-- WhatsApp -->
                <a href="https://wa.me/1234567890" target="_blank" aria-label="WhatsApp" class="icon">
                    <img src="../assets/whatsapp-icon-free-png.webp" alt="WhatsApp">
                </a>
                
                <!-- Facebook -->
                <a href="https://facebook.com/tu-pagina" target="_blank" aria-label="Facebook" class="icon">
                    <img src="../assets/Logo_de_Facebook.png" alt="Facebook">
                </a>
                
                <!-- Instagram -->
                <a href="https://instagram.com/tu-usuario" target="_blank" aria-label="Instagram" class="icon">
                    <img src="../assets/Instagram_icon.png" alt="Instagram">
                </a>
                
                <!-- Email -->
                <a href="mailto:correo@ejemplo.com" aria-label="Email" class="icon">
                    <img src="../assets/Email png.png" alt="Email">
                </a>
            </div>
        </div>
        <p class="pie-pag">&copy; 2026 Kenny. Todos los derechos reservados.</p>
    </footer>

    <!-- JS de Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
